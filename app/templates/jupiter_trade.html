<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jupiter 交易</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f5f5; }
    .trade-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .wallet-info {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .wallet-info .address {
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
    }
    .balance-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .balance-item:last-child { border-bottom: none; }
    .balance-label { opacity: 0.9; }
    .balance-value { font-weight: 600; font-size: 18px; }
    .btn-buy { background: linear-gradient(135deg, #2fb344 0%, #27ae60 100%); border: none; color: white; }
    .btn-buy:hover { background: linear-gradient(135deg, #27ae60 0%, #2fb344 100%); color: white; }
    .btn-sell { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); border: none; color: white; }
    .btn-sell:hover { background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%); color: white; }
    .btn-refresh { background: rgba(255,255,255,0.2); border: none; color: white; }
    .btn-refresh:hover { background: rgba(255,255,255,0.3); color: white; }
    .btn-lg { padding: 12px 32px; font-size: 16px; font-weight: 600; }
    .form-control-lg { padding: 12px 16px; font-size: 16px; }
    .result-area {
      border: 2px dashed #dee2e6;
      border-radius: 8px;
      padding: 20px;
      min-height: 120px;
      margin-top: 20px;
    }
    .result-success { border-color: #2fb344; background: #f0fff4; }
    .result-error { border-color: #e74c3c; background: #fff5f5; }
    .tx-link { 
      display: inline-block;
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-top: 8px;
    }
    .spinner-border-sm { width: 1rem; height: 1rem; }
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-card {
      background: white;
      padding: 30px 50px;
      border-radius: 12px;
      text-align: center;
    }
    .token-balance {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      color: white;
    }
    .token-balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .token-balance-value {
      font-size: 20px;
      font-weight: 600;
    }
    .current-mint {
      font-family: monospace;
      font-size: 11px;
      opacity: 0.8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-card">
      <div class="spinner-border text-primary mb-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <div id="loadingText" class="h5 mb-0">正在处理交易...</div>
      <div class="small text-muted mt-2">请等待区块链确认</div>
    </div>
  </div>

  <div class="container-fluid p-4">
    <!-- 钱包信息 -->
    <div class="wallet-info">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h5 class="mb-2">💼 我的钱包</h5>
          <div class="wallet-address mb-2" id="walletAddress">加载中...</div>
        </div>
        <button class="btn btn-refresh btn-sm" onclick="refreshAll()">🔄 刷新</button>
      </div>
      <div class="balance-item">
        <span class="balance-label">💰 SOL 余额</span>
        <span class="balance-value" id="solBalance">-</span>
      </div>
      <div class="token-balance" id="tokenBalanceInfo" style="display: none;">
        <div class="token-balance-header">
          <span>🪙 代币余额 <span id="currentMintDisplay" class="current-mint"></span></span>
          <button class="btn btn-refresh btn-sm" onclick="refreshTokenBalance()">🔄</button>
        </div>
        <div class="token-balance-value" id="tokenBalance">-</div>
      </div>
    </div>

    <!-- 交易表单 -->
    <div class="row">
      <!-- 买入面板 -->
      <div class="col-md-6">
        <div class="trade-card">
          <h5 class="mb-4">🟢 买入</h5>
          <div class="mb-3">
            <label class="form-label">Mint 地址</label>
            <input type="text" id="buyMint" class="form-control form-control-lg" 
                   placeholder="输入代币 Mint 地址" style="font-family: monospace;">
          </div>
          <div class="mb-3">
            <label class="form-label">购买 SOL 数量</label>
            <div class="input-group">
              <input type="number" id="buyAmount" class="form-control form-control-lg" 
                     placeholder="0.0" step="0.001" min="0.001">
              <span class="input-group-text">SOL</span>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">滑点 (可选)</label>
            <select id="buySlippage" class="form-select">
              <option value="100">1%</option>
              <option value="200">2%</option>
              <option value="500" selected>5%</option>
              <option value="1000">10%</option>
              <option value="2000">20%</option>
            </select>
          </div>
          <button class="btn btn-buy btn-lg w-100" onclick="doBuy()">
            买入
          </button>
        </div>
      </div>

      <!-- 卖出面板 -->
      <div class="col-md-6">
        <div class="trade-card">
          <h5 class="mb-4">🔴 卖出</h5>
          <div class="mb-3">
            <label class="form-label">Mint 地址</label>
            <input type="text" id="sellMint" class="form-control form-control-lg" 
                   placeholder="输入代币 Mint 地址" style="font-family: monospace;">
          </div>
          <div class="mb-3">
            <label class="form-label">卖出百分比</label>
            <div class="input-group">
              <input type="number" id="sellPercent" class="form-control form-control-lg" 
                     placeholder="100" step="1" min="1" max="100" value="100">
              <span class="input-group-text">%</span>
            </div>
            <div class="mt-2">
              <button class="btn btn-outline-secondary btn-sm me-1" onclick="setSellPercent(25)">25%</button>
              <button class="btn btn-outline-secondary btn-sm me-1" onclick="setSellPercent(50)">50%</button>
              <button class="btn btn-outline-secondary btn-sm me-1" onclick="setSellPercent(75)">75%</button>
              <button class="btn btn-outline-secondary btn-sm" onclick="setSellPercent(100)">100%</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">滑点 (可选)</label>
            <select id="sellSlippage" class="form-select">
              <option value="100">1%</option>
              <option value="200">2%</option>
              <option value="500" selected>5%</option>
              <option value="1000">10%</option>
              <option value="2000">20%</option>
            </select>
          </div>
          <button class="btn btn-sell btn-lg w-100" onclick="doSell()">
            卖出
          </button>
        </div>
      </div>
    </div>

    <!-- 结果显示 -->
    <div class="trade-card">
      <h5 class="mb-3">📋 交易结果</h5>
      <div id="resultArea" class="result-area">
        <div class="text-muted text-center">
          交易结果将显示在这里
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentMint = '';

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadWalletInfo();
    });

    // 加载钱包信息
    async function loadWalletInfo() {
      try {
        const resp = await fetch('/api/jupiter/wallet');
        const data = await resp.json();
        
        document.getElementById('walletAddress').textContent = data.wallet_address || '未知';
        document.getElementById('solBalance').textContent = (data.sol_balance || 0).toFixed(4) + ' SOL';
      } catch (e) {
        document.getElementById('walletAddress').textContent = '加载失败: ' + e.message;
        document.getElementById('solBalance').textContent = '-';
      }
    }

    // 刷新所有余额
    async function refreshAll() {
      await loadWalletInfo();
      if (currentMint) {
        await loadTokenBalance(currentMint);
      }
    }

    // 刷新代币余额（手动按钮调用）
    async function refreshTokenBalance() {
      if (!currentMint) {
        alert('请先输入要查询的 Mint 地址');
        return;
      }
      await loadTokenBalance(currentMint);
    }

    // 加载代币余额
    async function loadTokenBalance(mint) {
      if (!mint) return;
      
      try {
        const resp = await fetch('/api/jupiter/balance/' + mint);
        const data = await resp.json();
        
        if (data.token_balance && data.token_balance.balance > 0) {
          document.getElementById('tokenBalanceInfo').style.display = 'block';
          document.getElementById('tokenBalance').textContent = data.token_balance.balance_sol.toFixed(4);
          document.getElementById('currentMintDisplay').textContent = mint;
        } else {
          // 代币余额为0也显示，方便查看
          document.getElementById('tokenBalanceInfo').style.display = 'block';
          document.getElementById('tokenBalance').textContent = '0';
          document.getElementById('currentMintDisplay').textContent = mint;
        }
      } catch (e) {
        console.error('获取代币余额失败:', e);
        // 失败时也显示区域，但标记为失败
        document.getElementById('tokenBalanceInfo').style.display = 'block';
        document.getElementById('tokenBalance').textContent = '加载失败';
        document.getElementById('currentMintDisplay').textContent = mint;
      }
    }

    // 设置卖出百分比
    function setSellPercent(percent) {
      document.getElementById('sellPercent').value = percent;
    }

    // 显示加载状态
    function showLoading(text) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    // 隐藏加载状态
    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    // 显示结果
    function showResult(success, message, data) {
      const area = document.getElementById('resultArea');
      
      if (success) {
        area.className = 'result-area result-success';
        let html = '<div class="text-success h5 mb-2">✅ ' + message + '</div>';
        html += '<div class="row mt-3">';
        html += '<div class="col-md-6">';
        html += '<p class="mb-1"><strong>状态:</strong> ' + (data.status || 'unknown') + '</p>';
        html += '<p class="mb-1"><strong>类型:</strong> ' + (data.type || '-') + '</p>';
        html += '</div>';
        html += '<div class="col-md-6">';
        if (data.in_amount) html += '<p class="mb-1"><strong>输入:</strong> ' + data.in_amount + '</p>';
        if (data.out_amount) html += '<p class="mb-1"><strong>输出:</strong> ' + data.out_amount + '</p>';
        if (data.out_amount_sol) html += '<p class="mb-1"><strong>获得 SOL:</strong> ' + data.out_amount_sol.toFixed(6) + '</p>';
        html += '</div>';
        html += '</div>';
        
        if (data.tx_url) {
          html += '<div class="mt-3">';
          html += '<p class="mb-1"><strong>交易链接:</strong></p>';
          html += '<a href="' + data.tx_url + '" target="_blank" class="tx-link">' + data.tx_url + '</a>';
          html += '</div>';
        }
        
        if (data.signature) {
          html += '<div class="mt-2">';
          html += '<p class="mb-1 small text-muted"><strong>Signature:</strong></p>';
          html += '<code class="small" style="word-break: break-all;">' + data.signature + '</code>';
          html += '</div>';
        }
        
        area.innerHTML = html;
      } else {
        area.className = 'result-area result-error';
        area.innerHTML = '<div class="text-danger h5 mb-2">❌ ' + message + '</div>' +
                         '<div class="mt-3"><code>' + (data.error || '未知错误') + '</code></div>';
      }
    }

    // 执行买入（直接执行，不预检余额）
    async function doBuy() {
      const mint = document.getElementById('buyMint').value.trim();
      const solAmount = parseFloat(document.getElementById('buyAmount').value);
      const slippage = parseInt(document.getElementById('buySlippage').value);

      if (!mint) {
        alert('请输入 Mint 地址');
        return;
      }
      if (!solAmount || solAmount <= 0) {
        alert('请输入有效的 SOL 数量');
        return;
      }

      if (!confirm('确认买入?\n\n代币: ' + mint + '\n数量: ' + solAmount + ' SOL\n滑点: ' + (slippage/100) + '%')) {
        return;
      }

      showLoading('正在执行买入交易...');
      
      try {
        const resp = await fetch('/api/jupiter/buy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mint: mint,
            sol_amount: solAmount,
            slippage_bps: slippage
          })
        });
        
        const data = await resp.json();
        
        hideLoading();
        
        if (data.success) {
          showResult(true, data.message, data);
          // 买入成功后，更新当前 mint 并刷新代币余额
          currentMint = mint;
          // 同步到卖出面板
          document.getElementById('sellMint').value = mint;
          // 刷新余额
          await refreshAll();
        } else {
          showResult(false, data.message, data);
        }
      } catch (e) {
        hideLoading();
        showResult(false, '请求失败: ' + e.message, { error: e.message });
      }
    }

    // 执行卖出（直接执行，不预检余额）
    async function doSell() {
      const mint = document.getElementById('sellMint').value.trim();
      const percent = parseInt(document.getElementById('sellPercent').value);
      const slippage = parseInt(document.getElementById('sellSlippage').value);

      if (!mint) {
        alert('请输入 Mint 地址');
        return;
      }
      if (!percent || percent <= 0 || percent > 100) {
        alert('请输入有效的百分比 (1-100)');
        return;
      }

      if (!confirm('确认卖出?\n\n代币: ' + mint + '\n卖出比例: ' + percent + '%\n滑点: ' + (slippage/100) + '%')) {
        return;
      }

      showLoading('正在执行卖出交易...');
      
      try {
        const resp = await fetch('/api/jupiter/sell', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mint: mint,
            percent: percent,
            slippage_bps: slippage
          })
        });
        
        const data = await resp.json();
        
        hideLoading();
        
        if (data.success) {
          showResult(true, data.message, data);
          // 刷新余额
          currentMint = mint;
          await refreshAll();
        } else {
          showResult(false, data.message, data);
        }
      } catch (e) {
        hideLoading();
        showResult(false, '请求失败: ' + e.message, { error: e.message });
      }
    }

    // 当买入 Mint 变化时，同步到卖出面板并更新代币余额
    document.getElementById('buyMint').addEventListener('change', function() {
      const sellMint = document.getElementById('sellMint');
      const mint = this.value.trim();
      if (mint) {
        sellMint.value = mint;
        currentMint = mint;
        loadTokenBalance(mint);
      }
    });

    // 当卖出 Mint 变化时，更新代币余额显示
    document.getElementById('sellMint').addEventListener('change', function() {
      const mint = this.value.trim();
      if (mint) {
        currentMint = mint;
        loadTokenBalance(mint);
      }
    });
  </script>
</body>
</html>
